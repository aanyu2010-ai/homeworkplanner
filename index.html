<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Homework — Assignment Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #000000;
    --paper-line: rgba(41,121,255,0.16);
    --margin-red: #ff3b5c;
    --ink: #eaf1ff;
    --ink-soft: #9db3e0;
    --tab-yellow: #f0b93d;
    --tab-mint: #4fe0b0;
    --tab-lilac: #b18aff;
    --tab-coral: #ff8f70;
    --tab-sky: #2979ff;
    --done: #4a5578;
    --card: #0a0e17;
    --card-border: #1c3a7a;
    --muted-card: #8fa3d1;
    --line-on-paper: rgba(41,121,255,0.35);
    --electric: #2979ff;
    --electric-bright: #5b9cff;
    --shadow: 0 0 0 1px rgba(41,121,255,0.08), 0 4px 16px rgba(0,0,0,0.6);
    --radius: 3px;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  body {
    background-image:
      linear-gradient(var(--paper-line) 1px, transparent 1px);
    background-size: 100% 34px;
    background-position: 0 92px;
    min-height: 100vh;
  }

  .page {
    max-width: 720px;
    margin: 0 auto;
    padding: 0 28px 80px 68px;
    position: relative;
  }

  .margin-line {
    position: absolute;
    top: 0;
    left: 40px;
    width: 2px;
    height: 100%;
    background: var(--electric);
    opacity: 0.55;
  }

  header {
    padding: 40px 0 22px 0;
  }

  header h1 {
    font-family: 'Kalam', cursive;
    font-weight: 700;
    font-size: 44px;
    margin: 0;
    line-height: 1;
    color: var(--ink);
    letter-spacing: -0.5px;
  }

  header .sub {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--ink-soft);
    margin-top: 8px;
    letter-spacing: 0.03em;
  }

  #status-count {
    font-weight: 600;
    color: var(--margin-red);
  }

  /* ---- Add form ---- */
  .add-row {
    background: var(--card);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 14px 16px;
    margin: 4px 0 30px 0;
    display: grid;
    grid-template-columns: 1fr 1fr auto auto;
    gap: 10px;
    align-items: end;
  }

  .field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .field label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted-card);
  }

  .field input, .field select {
    font-family: 'IBM Plex Sans', sans-serif;
    font-size: 14px;
    padding: 7px 8px;
    border: 1px solid #22345c;
    border-radius: 2px;
    background: #060a12;
    color: var(--ink);
    min-width: 0;
    color-scheme: dark;
  }

  .field input:focus, .field select:focus, button:focus-visible, .checkbox:focus-visible {
    outline: 2px solid var(--electric-bright);
    outline-offset: 1px;
  }

  #btn-add {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    font-size: 13px;
    background: var(--ink);
    color: #fff;
    border: none;
    border-radius: 2px;
    padding: 9px 16px;
    cursor: pointer;
    white-space: nowrap;
    transition: transform 0.08s ease, background 0.15s ease;
  }
  #btn-add:hover { background: #384158; }
  #btn-add:active { transform: translateY(1px); }

  @media (max-width: 620px) {
    .add-row { grid-template-columns: 1fr 1fr; }
    #btn-add { grid-column: 1 / -1; }
  }

  /* ---- Filters ---- */
  .filters {
    display: flex;
    gap: 8px;
    margin-bottom: 26px;
    flex-wrap: wrap;
  }

  .chip {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11.5px;
    padding: 5px 12px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.45);
    background: transparent;
    color: #fff;
    cursor: pointer;
    letter-spacing: 0.02em;
  }
  .chip.active { background: #fff; color: var(--paper); border-color: #fff; }

  /* ---- Section groups ---- */
  .group-title {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: #dbe3ff;
    margin: 26px 0 10px 0;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .group-title.overdue { color: #ffd5d5; }
  .group-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--line-on-paper);
  }

  .entries { display: flex; flex-direction: column; gap: 8px; }

  .card {
    background: var(--card);
    border: 1px solid #e3e7ec;
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px 12px 0;
    position: relative;
    overflow: hidden;
  }

  .tab {
    width: 8px;
    align-self: stretch;
    flex-shrink: 0;
  }

  .checkbox {
    appearance: none;
    -webkit-appearance: none;
    width: 19px;
    height: 19px;
    border: 2px solid #b7bfcc;
    border-radius: 3px;
    cursor: pointer;
    flex-shrink: 0;
    position: relative;
    background: #fff;
  }
  .checkbox:checked {
    background: var(--ink);
    border-color: var(--ink);
  }
  .checkbox:checked::after {
    content: '';
    position: absolute;
    left: 5px;
    top: 1px;
    width: 5px;
    height: 10px;
    border: solid #fff;
    border-width: 0 2px 2px 0;
    transform: rotate(40deg);
  }

  .entry-main { flex: 1; min-width: 0; }

  .entry-title {
    font-size: 15px;
    font-weight: 500;
    color: var(--ink);
    word-break: break-word;
  }
  .card.done .entry-title { color: var(--done); text-decoration: line-through; }

  .entry-subject {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--muted-card);
    margin-top: 2px;
  }

  .due-stamp {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    font-weight: 600;
    padding: 4px 9px;
    border: 1.5px solid currentColor;
    border-radius: 2px;
    transform: rotate(-2deg);
    white-space: nowrap;
    flex-shrink: 0;
  }
  .due-stamp.overdue { color: var(--margin-red); }
  .due-stamp.today { color: #b5851f; }
  .due-stamp.upcoming { color: var(--muted-card); }
  .due-stamp.none { color: #b7bfcc; border-style: dashed; }

  .del-btn {
    background: none;
    border: none;
    color: #c3cad5;
    font-size: 16px;
    cursor: pointer;
    padding: 4px 10px;
    flex-shrink: 0;
    line-height: 1;
    transition: color 0.15s ease;
  }
  .del-btn:hover { color: var(--margin-red); }

  .empty {
    font-family: 'Kalam', cursive;
    font-size: 18px;
    color: #eef1ff;
    text-align: center;
    padding: 50px 10px;
    border: 1.5px dashed rgba(255,255,255,0.4);
    border-radius: var(--radius);
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
<div class="page">
  <div class="margin-line"></div>
  <header>
    <h1>Homework</h1>
    <div class="sub"><span id="status-count">—</span></div>
  </header>

  <form class="add-row" id="add-form" autocomplete="off">
    <div class="field">
      <label for="in-title">Assignment</label>
      <input id="in-title" type="text" placeholder="Read chapter 4" required maxlength="120">
    </div>
    <div class="field">
      <label for="in-subject">Subject</label>
      <input id="in-subject" type="text" placeholder="History" required maxlength="40">
    </div>
    <div class="field">
      <label for="in-due">Due</label>
      <input id="in-due" type="date">
    </div>
    <button type="submit" id="btn-add">+ Add</button>
  </form>

  <div class="filters" id="filters">
    <button class="chip active" data-filter="active">Active</button>
    <button class="chip" data-filter="all">All</button>
    <button class="chip" data-filter="done">Done</button>
  </div>

  <div id="content"></div>
</div>

<script>
(function(){
  const STORAGE_KEY = 'homework:items';
  let items = [];
  let filter = 'active';
  let loaded = false;

  const contentEl = document.getElementById('content');
  const statusEl = document.getElementById('status-count');
  const form = document.getElementById('add-form');
  const filtersEl = document.getElementById('filters');

  const tabColors = ['tab-yellow','tab-mint','tab-lilac','tab-coral','tab-sky'];
  const subjectColorMap = {};
  function colorFor(subject){
    const key = subject.trim().toLowerCase();
    if (!subjectColorMap[key]){
      const idx = Object.keys(subjectColorMap).length % tabColors.length;
      subjectColorMap[key] = tabColors[idx];
    }
    return subjectColorMap[key];
  }

  function uid(){ return 'hw_' + Date.now() + '_' + Math.random().toString(36).slice(2,8); }

  function todayStr(){
    const d = new Date();
    return d.toISOString().slice(0,10);
  }

  function dueCategory(due){
    if (!due) return 'none';
    const today = todayStr();
    if (due < today) return 'overdue';
    if (due === today) return 'today';
    return 'upcoming';
  }

  function formatDue(due){
    if (!due) return 'No date';
    const [y,m,d] = due.split('-').map(Number);
    const dt = new Date(y, m-1, d);
    const opts = { month: 'short', day: 'numeric' };
    const cat = dueCategory(due);
    const label = dt.toLocaleDateString('en-US', opts);
    if (cat === 'overdue') return 'Was due ' + label;
    if (cat === 'today') return 'Due today';
    return 'Due ' + label;
  }

  async function load(){
    try {
      const res = await window.storage.get(STORAGE_KEY, false);
      items = res && res.value ? JSON.parse(res.value) : [];
    } catch (e) {
      items = [];
    }
    loaded = true;
    render();
  }

  async function save(){
    try {
      await window.storage.set(STORAGE_KEY, JSON.stringify(items), false);
    } catch (e) {
      console.error('Could not save', e);
    }
  }

  function addItem(title, subject, due){
    items.push({ id: uid(), title: title.trim(), subject: subject.trim(), due: due || '', done: false, createdAt: Date.now() });
    save();
    render();
  }

  function toggleItem(id){
    const it = items.find(i => i.id === id);
    if (it) it.done = !it.done;
    save();
    render();
  }

  function deleteItem(id){
    items = items.filter(i => i.id !== id);
    save();
    render();
  }

  function cardHTML(it){
    const cat = dueCategory(it.due);
    const color = colorFor(it.subject);
    return `
      <div class="card ${it.done ? 'done' : ''}" data-id="${it.id}">
        <div class="tab" style="background: var(--${color})"></div>
        <input type="checkbox" class="checkbox" ${it.done ? 'checked' : ''} aria-label="Mark ${escapeAttr(it.title)} as ${it.done ? 'not done' : 'done'}">
        <div class="entry-main">
          <div class="entry-title">${escapeHTML(it.title)}</div>
          <div class="entry-subject">${escapeHTML(it.subject)}</div>
        </div>
        <div class="due-stamp ${cat}">${formatDue(it.due)}</div>
        <button class="del-btn" aria-label="Delete ${escapeAttr(it.title)}">✕</button>
      </div>`;
  }

  function escapeHTML(s){
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }
  function escapeAttr(s){ return escapeHTML(s); }

  function render(){
    if (!loaded){
      contentEl.innerHTML = '<div class="empty">Loading your assignments…</div>';
      return;
    }

    const active = items.filter(i => !i.done);
    const done = items.filter(i => i.done);
    const overdueCount = active.filter(i => dueCategory(i.due) === 'overdue').length;

    statusEl.textContent = active.length === 0
      ? 'Nothing on the list right now.'
      : `${active.length} open · ${overdueCount} overdue`;

    let pool;
    if (filter === 'active') pool = active;
    else if (filter === 'done') pool = done;
    else pool = items;

    if (pool.length === 0){
      const msg = filter === 'done' ? "Nothing finished yet." : "No homework logged. Add your first assignment above.";
      contentEl.innerHTML = `<div class="empty">${msg}</div>`;
      return;
    }

    if (filter === 'done'){
      const sorted = [...pool].sort((a,b) => b.createdAt - a.createdAt);
      contentEl.innerHTML = `<div class="entries">${sorted.map(cardHTML).join('')}</div>`;
      return;
    }

    const groups = { overdue: [], today: [], upcoming: [], none: [] };
    pool.forEach(i => groups[dueCategory(i.due)].push(i));
    Object.keys(groups).forEach(k => groups[k].sort((a,b) => (a.due || '9999').localeCompare(b.due || '9999')));

    const labels = { overdue: 'Overdue', today: 'Due today', upcoming: 'Upcoming', none: 'No date' };
    let html = '';
    ['overdue','today','upcoming','none'].forEach(k => {
      if (groups[k].length === 0) return;
      html += `<div class="group-title ${k === 'overdue' ? 'overdue' : ''}">${labels[k]}</div>`;
      html += `<div class="entries">${groups[k].map(cardHTML).join('')}</div>`;
    });

    contentEl.innerHTML = html;
  }

  form.addEventListener('submit', function(e){
    e.preventDefault();
    const title = document.getElementById('in-title').value;
    const subject = document.getElementById('in-subject').value;
    const due = document.getElementById('in-due').value;
    if (!title.trim() || !subject.trim()) return;
    addItem(title, subject, due);
    form.reset();
    document.getElementById('in-title').focus();
  });

  contentEl.addEventListener('click', function(e){
    const card = e.target.closest('.card');
    if (!card) return;
    const id = card.dataset.id;
    if (e.target.classList.contains('checkbox')) toggleItem(id);
    else if (e.target.classList.contains('del-btn')) deleteItem(id);
  });

  filtersEl.addEventListener('click', function(e){
    const btn = e.target.closest('.chip');
    if (!btn) return;
    filter = btn.dataset.filter;
    [...filtersEl.children].forEach(c => c.classList.toggle('active', c === btn));
    render();
  });

  load();
})();
</script>
</body>
</html>
